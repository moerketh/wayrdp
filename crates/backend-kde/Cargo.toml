[package]
name = "backend-kde"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "wayrdp KDE Plasma backend — adapter over hyperv-rdp-extras kwin-virtual"

[dependencies]
desk-backend = { path = "../desk-backend" }
# Pin discipline: validate a bumped extras rev before landing it here.
hyperv-rdp-extras = { git = "https://github.com/moerketh/hyperv-rdp-extras", rev = "8dcaf6aea928d2123ac7ba0ece45082b62eeaa4e", default-features = false, features = ["geometry", "transport", "cursor", "kwin-virtual"] }
anyhow = "1"
thiserror = "1"
