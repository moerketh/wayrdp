[package]
name = "backend-kde"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "wayrdp KDE Plasma backend — adapter over hyperv-rdp-extras kwin-virtual"

[dependencies]
desk-backend = { path = "../desk-backend" }
input-keymap = { path = "../input-keymap" }
clipboard-wayland = { path = "../clipboard-wayland" }
capture-pipewire = { path = "../capture-pipewire" }
input-eis = { path = "../input-eis" }
# Pin discipline: validate a bumped extras rev before landing it here.
hyperv-rdp-extras = { git = "https://github.com/moerketh/hyperv-rdp-extras", rev = "8dcaf6aea928d2123ac7ba0ece45082b62eeaa4e", default-features = false, features = ["geometry", "transport", "cursor", "kwin-virtual"] }
# Session task runtime: extras' kwin-virtual API is async and tokio::spawns
# follow-up tasks (containment reattach) that need a live runtime.
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
# Input: D-Bus for KWin's EIS fd (the libei side lives in input-eis).
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
anyhow = "1"
