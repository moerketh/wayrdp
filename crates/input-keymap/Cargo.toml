[package]
name = "input-keymap"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "wayrdp input helpers shared by backends: RDP scancode -> evdev, modifier bits, monotonic stamps"

[dependencies]
# RDP scancode -> evdev keycode via WinPR's VK tables (F1). On non-freerdp
# builds the crate compiles a stub and the legacy -8 map is used.
freerdp-sys = { path = "../freerdp-sys" }
libc = "0.2"
