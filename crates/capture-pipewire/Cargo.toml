[package]
name = "capture-pipewire"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "wayrdp SHM-only PipeWire frame consumer and blank-desktop health monitor, shared by the KDE and GNOME backends"

[dependencies]
desk-backend = { path = "../desk-backend" }
input-keymap = { path = "../input-keymap" }
# Frames from a compositor's screencast node on the session PipeWire daemon.
pipewire = "0.10"
tokio = { version = "1", features = ["sync"] }
