# Tag-triggered release: builds the wayrdp packages and publishes them as
# GitHub release assets (tar.gz, .deb, SHA256SUMS) for direct download.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # Pinned to the image whose dev-library set the build is proven on
    # (FreeRDP 3.x headers; ubuntu-latest may move past it).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            freerdp3-dev \
            libclang-dev \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev

      - name: Verify tag matches Cargo version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' server/Cargo.toml | head -n1)"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match server/Cargo.toml version ${cargo_version}"
            exit 1
          fi
          echo "Release version: ${tag_version}"

      # A green check is meaningless if freerdp-sys fell back to stub mode,
      # so guard against pkg-config missing the FreeRDP 3 headers.
      - name: Check workspace against real FreeRDP
        run: |
          set -euo pipefail
          cargo check --workspace 2>&1 | tee check.log
          if grep -Eq 'not found via pkg-config|building as stub' check.log; then
            echo "::error::freerdp-sys built as a stub; FreeRDP dev headers not found on the runner"
            exit 1
          fi

      - name: Run tests
        run: cargo test --workspace

      - name: Build release packages
        run: bash scripts/build-package.sh --version "${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/release/wayrdp-*-linux-x86_64.tar.gz \
            dist/release/wayrdp_*_amd64.deb \
            dist/release/SHA256SUMS.txt \
            --title "wayrdp ${GITHUB_REF_NAME#v}" \
            --generate-notes
